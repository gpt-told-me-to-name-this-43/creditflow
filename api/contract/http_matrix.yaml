# Независимый эталон Design 2.5. Поддерживается вручную, НЕ из OpenAPI.
design: '2.5'
operations:
- method: POST
  path: /api/v1/auth/login
  access: public
  responses:
    200:
      model: TokenResponse
    401:
      model: ErrorEnvelope
      codes:
      - INVALID_CREDENTIALS
    422:
      model: ErrorEnvelope
      codes:
      - VALIDATION_ERROR
    429:
      model: ErrorEnvelope
      codes:
      - TOO_MANY_ATTEMPTS
      retry_after: true
    500:
      model: ErrorEnvelope
      codes:
      - INTERNAL_ERROR
    503:
      model: ErrorEnvelope
      codes:
      - SERVICE_UNAVAILABLE
  condition: 'local/test; production: health only'
