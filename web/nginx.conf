# nginx для web: SPA + прокси /api/ на api (один origin, CORS не нужен; design.md §3.2).
# Работает без root: порт 8080, pid и временные файлы в /tmp.
# Защитные заголовки и CSP — design.md §4; повторяются в каждом location с add_header,
# потому что add_header внутри location отменяет заголовки уровня server.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Request id (#5): входящий X-Request-ID, если он в формате api и ext-sim
  # ([A-Za-z0-9._:-]{1,128}), иначе свой $request_id. Тот же id уходит в api и в лог.
  map $http_x_request_id $req_id {
    "~^[A-Za-z0-9._:-]{1,128}$" $http_x_request_id;
    default $request_id;
  }

  # В лог попадает путь без query-строки; тела запросов не логируются.
  log_format main '$remote_addr "$request_method $uri" $status $body_bytes_sent $request_time '
                  'request_id=$req_id';
  access_log /dev/stdout main;

  sendfile on;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # CSP: только свой origin. style-src 'unsafe-inline' — Radix и sonner ставят style-атрибуты
  # (позиционирование подсказок и тостов); скриптов inline нет. data: — картинки из CSS.
  map $uri $csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;

    # Встроенный DNS Docker. Имя api резолвится на каждый запрос (кеш 10 с), а не один
    # раз при старте: после перезапуска контейнер api может получить другой IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
      # proxy_pass с переменной и без URI передаёт исходный путь запроса как есть.
      set $api_upstream http://api:8000;
      proxy_pass $api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # IP для лимита входа: api доверяет X-Real-IP только от прокси (TRUSTED_PROXY_CIDRS).
      # Значение перезаписывается, поэтому клиент не подставит свой.
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-ID $req_id;
      proxy_read_timeout 60s;
    }

    # Файлы Vite с хешем в имени.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header Content-Security-Policy $csp always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      try_files $uri =404;
    }

    # index.html не кешируется: после деплоя браузер сразу получает новые хеши ассетов.
    location = /index.html {
      add_header Cache-Control "no-cache";
      add_header Content-Security-Policy $csp always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # SPA-fallback: неизвестный путь отдаёт index.html (тоже без кеша).
    location / {
      add_header Cache-Control "no-cache";
      add_header Content-Security-Policy $csp always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
