# nginx для web: SPA + прокси /api/ на api (один origin, CORS не нужен; design.md §3.2).
# Работает без root: порт 8080, pid и временные файлы в /tmp.
# CSP и защитные заголовки (design.md §4) добавит #5.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # В лог попадает путь без query-строки; тела запросов не логируются.
  log_format main '$remote_addr "$request_method $uri" $status $body_bytes_sent $request_time';
  access_log /dev/stdout main;

  sendfile on;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ {
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # Файлы Vite с хешем в имени.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    # SPA-fallback: неизвестный путь отдаёт index.html.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
