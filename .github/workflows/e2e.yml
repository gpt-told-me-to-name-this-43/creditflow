name: E2E

# Сквозной путь в браузере (#10): стек в compose с LLM_MODE=replay, reset по токену,
# Playwright одним worker-ом без ретраев. Обязательная проверка ветки master.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_COMPOSE: docker compose -f ${{ github.workspace }}/docker-compose.yml -f ${{ github.workspace }}/docker-compose.e2e.yml
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      # Синтетический .env из примера: демо-учётки, локальный секрет JWT, без ключей LLM.
      - run: cp .env.example .env
      # Секрет job-а; без него (PR из форка) — одноразовый случайный. api требует ≥ 32 байт.
      - name: Токен reset
        env:
          SECRET_TOKEN: ${{ secrets.TEST_RESET_TOKEN }}
        run: |
          token="${SECRET_TOKEN:-$(openssl rand -hex 32)}"
          echo "::add-mask::$token"
          echo "TEST_RESET_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Стек (replay, APP_ENV=test, reset по токену)
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up --build -d --wait
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm e2e
        working-directory: web
      - name: Логи стека при падении
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color api web ext-sim > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
            compose.log
          retention-days: 14
