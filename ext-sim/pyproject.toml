[project]
name = "creditflow-ext-sim"
version = "0.1.0"
description = "CreditFlow: симулятор внешних систем (ЕГРЮЛ, ЕГРИП, ФНС, БКИ, выписка)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.159.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF", "DTZ"]
# Кириллица в строках и комментариях — норма для проекта.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
